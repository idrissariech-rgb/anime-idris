<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأنمي - Crunchyroll Style</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #f47521;
            margin-bottom: 20px;
        }
        .search-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 30px;
            border: 2px solid #f47521;
            background-color: #1f1f1f;
            color: #fff;
            outline: none;
            box-sizing: border-box;
        }
        .loading {
            text-align: center;
            font-size: 20px;
            color: #aaa;
            margin-top: 50px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .anime-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .anime-info {
            padding: 15px;
            text-align: center;
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .watch-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #f47521;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }
        .watch-btn:hover {
            background-color: #d25d10;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>منصة الأنمي</h1>
        
        <!-- شريط البحث الفوري -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن أي أنمي (مثل: Naruto, One Piece)..." oninput="searchAnime()">
        </div>

        <div id="loading" class="loading">جاري جلب الأنميات...</div>
        
        <div class="anime-grid" id="animeGrid"></div>
    </div>

    <script>
        let allAnimeData = [];

        async function fetchAnime() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/seasons/now');
                const data = await response.json();
                allAnimeData = data.data;
                displayAnime(allAnimeData);
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                document.getElementById('loading').innerText = 'حدث خطأ أثناء جلب البيانات.';
            }
        }

        function displayAnime(animeList) {
            const animeGrid = document.getElementById('animeGrid');
            animeGrid.innerHTML = '';
            
            if (!animeList || animeList.length === 0) {
                animeGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #aaa;">لا توجد نتائج مطابقة لبحثك</p>';
                return;
            }

            animeList.slice(0, 20).forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                
                card.innerHTML = `
                    <div>
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-img">
                        <div class="anime-info">
                            <div class="anime-title" title="${anime.title_english || anime.title}">${anime.title_english || anime.title}</div>
                        </div>
                    </div>
                    <div class="anime-info" style="padding-top: 0;">
                        <a href="jujutsu.html" class="watch-btn">مشاهدة الحلقات</a>
                    </div>
                `;
                animeGrid.appendChild(card);
            });
        }

        async function searchAnime() {
            const query = document.getElementById('searchInput').value.trim();
            const animeGrid = document.getElementById('animeGrid');
            const loading = document.getElementById('loading');

            if (query.length === 0) {
                displayAnime(allAnimeData);
                return;
            }

            if (query.length < 2) return;

            loading.style.display = 'block';
            animeGrid.innerHTML = '';

            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=16`);
                const data = await response.json();
                loading.style.display = 'none';
                displayAnime(data.data);
            } catch (error) {
                loading.style.display = 'none';
                document.getElementById('loading').innerText = 'خطأ في البحث.';
            }
        }

        fetchAnime();
    </script>

</body>
</html>
