<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأنمي التلقائية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 30px;
        }
        .loading {
            text-align: center;
            font-size: 20px;
            color: #aaa;
            margin-top: 50px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background-color: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .anime-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .anime-info {
            padding: 15px;
            text-align: center;
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .watch-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #e50914;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }
        .watch-btn:hover {
            background-color: #ff0a16;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>أحدث أنميات الموسم (تحديث تلقائي)</h1>
        
        <div id="loading" class="loading">جاري جلب أحدث الأنميات...</div>
        
        <div class="anime-grid" id="animeGrid"></div>
    </div>

    <script>
        // جلب الأنميات الجديدة مباشرة من قاعدة البيانات العالمية للأنمي
        async function fetchAnime() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/seasons/now');
                const data = await response.json();
                const animeGrid = document.getElementById('animeGrid');
                const loading = document.getElementById('loading');
                
                // إخفاء رسالة التحميل
                loading.style.display = 'none';
                
                // عرض أول 16 أنمي يتم عرضها حالياً في الموسم
                data.data.slice(0, 16).forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    
                    card.innerHTML = `
                        <div>
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}" class="anime-img">
                            <div class="anime-info">
                                <div class="anime-title" title="${anime.title_english || anime.title}">${anime.title_english || anime.title}</div>
                            </div>
                        </div>
                        <div class="anime-info" style="padding-top: 0;">
                            <a href="jujutsu.html" class="watch-btn">مشاهدة الحلقات</a>
                        </div>
                    `;
                    
                    animeGrid.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = 'حدث خطأ أثناء جلب البيانات. حاول مرة أخرى.';
            }
        }

        fetchAnime();
    </script>

</body>
</html>
